    <script>
      /* No-flash theme bootstrap. Runs synchronously in <head> BEFORE the
         boot loader paints, so the resolved theme class is on <html> for the
         very first frame. Must mirror getInitial() in
         src/hooks/useDarkMode.ts: read localStorage("theme"); else honour
         prefers-color-scheme (dark → "dark", not "navy"); else "light".
         "dark" and "navy" both add the Tailwind `dark` baseline class. */
      (function () {
        try {
          var THEMES = ["light", "dark", "navy"];
          var stored = localStorage.getItem("theme");
          var theme =
            THEMES.indexOf(stored) !== -1
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          var root = document.documentElement;
          root.classList.add(theme);
          if (theme === "dark" || theme === "navy") root.classList.add("dark");
        } catch (e) {
          /* localStorage blocked → fall through to light (no class). */
        }
      })();
    </script>
    <style>
      /* Pre-React boot loader. Lives inside #root and is auto-removed the
         moment createRoot().render() commits (React replaces #root's
         children), so no cleanup JS is needed. Mirrors the in-app
         TopProgressBar (2px top bar, accent #2563eb, progress-slide keyframe)
         so the handoff to the real app is seamless. The inline <head> script
         above sets the <html> theme class before this paints, so the boot bg
         keys off that class; the prefers-color-scheme query is only a fallback
         for the rare case the script is blocked (no theme class on <html>). */
      #spk-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #ffffff;
        color: #111827;
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }
      html.dark #spk-boot { background: #111827; color: #f9fafb; }
      html.navy #spk-boot { background: #050912; color: #f9fafb; }
      @media (prefers-color-scheme: dark) {
        html:not(.light):not(.dark):not(.navy) #spk-boot { background: #111827; color: #f9fafb; }
      }
      #spk-boot .spk-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        overflow: hidden;
        background: rgba(37, 99, 235, 0.2);
      }
      #spk-boot .spk-bar-seg {
        height: 100%;
        width: 33%;
        background: #2563eb;
        animation: spk-slide 1.1s ease-in-out infinite;
      }
      #spk-boot .spk-brand {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
        animation: spk-pulse 1.4s ease-in-out infinite;
      }
      @keyframes spk-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
      }
      @keyframes spk-pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #spk-boot .spk-bar-seg, #spk-boot .spk-brand { animation: none; }
      }
    </style>
